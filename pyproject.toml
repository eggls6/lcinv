[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcinv"
version = "0.2.0"
description = "Bayesian lightcurve inversion of asteroids from survey photometry: nested sampling of spin states with Laplace-marginalised convex shapes, and NUTS sampling of non-convex shapes"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["asteroids", "lightcurve inversion", "shape modelling", "Bayesian inference",
            "nested sampling", "Rubin Observatory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15",          # scipy.special.sph_harm_y
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jax>=0.4.30",
    "optax>=0.2.3",         # optax.lbfgs
    "dynesty>=2.1",
    "numpyro>=0.15",
    "arviz>=0.17",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "corner>=2.2",
]

[project.optional-dependencies]
netcdf = ["h5netcdf", "h5py"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26",
        "mkdocs-glightbox>=0.4"]
test = ["pytest>=7"]

[project.urls]
Documentation = "https://USER.github.io/lcinv/"
Source = "https://github.com/USER/lcinv"

[tool.setuptools.packages.find]
include = ["lcinv*"]

[tool.setuptools.package-data]
lcinv = ["vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["paper", "paper_hybrid"]

[tool.ruff.lint]
select = ["F", "E9"]
